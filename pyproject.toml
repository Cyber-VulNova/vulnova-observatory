[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnova-observatory"
version = "1.0.0"
description = "VulNova Observatory — the threat-intelligence portal (Atlas, Pulse, Signal, Flare) extending the VulNova CETM platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "VulNova Contributors"}
]
keywords = ["cve", "vulnerability", "security", "exploit", "osint", "threat-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "click>=8.1.7",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "rapidfuzz>=3.6.1",
    "jinja2>=3.1.3",
    "beautifulsoup4>=4.12.3",
    "aiofiles>=23.2.1",
    "anyio>=4.3.0",
    "flask>=3.0.0",
    "feedparser>=6.0.11",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
vulnova = "vulnova.cli:main"
vn = "vulnova.cli:main"

[project.urls]
Homepage = "https://github.com/nikheelkumar16/vulnova-observatory"
Repository = "https://github.com/nikheelkumar16/vulnova-observatory"
Issues = "https://github.com/nikheelkumar16/vulnova-observatory/issues"

[tool.hatch.build.targets.wheel]
packages = ["vulnova"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
