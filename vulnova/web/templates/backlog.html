<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulNova Backlog — Roadmap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <a href="/" class="brand-logo"><img src="{{ url_for('static', filename='vulnova-logo.svg') }}" alt="VulNova" class="brand-img"></a>
            <span class="brand-sub">Observatory</span>
            <nav class="topnav">
                <a href="/" class="topnav-link">Atlas · CVEs</a>
                <a href="/news" class="topnav-link">Pulse · News</a>
                <a href="/flare" class="topnav-link">Flare · Advisories</a>
                <a href="/sources" class="topnav-link">Signal · Sources</a>
                <a href="/orbit" class="topnav-link">Orbit · Tracking</a>
                <a href="/backlog" class="topnav-link active">Backlog</a>
            </nav>
        </div>
        <div class="topbar-stats">
            <button id="theme-toggle" class="btn btn-ghost btn-sm theme-toggle" title="Toggle light / dark theme">☀️</button>
            <span class="stat-pill" id="backlog-stat">—</span>
        </div>
    </header>

    <main class="backlog-page">
        <div class="atlas-intro" style="padding-left:0">
            <span class="atlas-title">Backlog</span>
            <span class="atlas-tag">The build roadmap — what's shipped, in progress, and planned for VulNova Observatory.</span>
        </div>

        <div class="backlog-filters" id="backlog-filters">
            <button class="pill pill-active" data-filter="all">All</button>
            <button class="pill" data-filter="done">✅ Done</button>
            <button class="pill" data-filter="in_progress">🚧 In progress</button>
            <button class="pill" data-filter="planned">🗓 Planned</button>
        </div>

        <div id="backlog-list" class="backlog-list"></div>
    </main>

    <script src="{{ url_for('static', filename='backlog.js') }}"></script>
</body>
</html>
