<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulNova Signal — Source Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <a href="/" class="brand-logo"><img src="{{ url_for('static', filename='vulnova-logo.svg') }}" alt="VulNova" class="brand-img"></a>
            <span class="brand-sub">Observatory</span>
            <nav class="topnav">
                <a href="/" class="topnav-link">Atlas · CVEs</a>
                <a href="/news" class="topnav-link">Pulse · News</a>
                <a href="/flare" class="topnav-link">Flare · Advisories</a>
                <a href="/sources" class="topnav-link active">Signal · Sources</a>
                <a href="/orbit" class="topnav-link">Orbit · Tracking</a>
                <a href="/backlog" class="topnav-link">Backlog</a>
            </nav>
        </div>
        <div class="topbar-stats">
            <span class="stat-pill" id="health-pill">checking…</span>
            <button id="refresh-btn" class="btn btn-ghost btn-sm">⟳ Re-check</button>
        </div>
    </header>

    <main class="sources-page">
        <div class="page-header">
            <div class="atlas-intro" style="padding-left:0">
                <span class="atlas-title">Signal</span>
                <span class="atlas-tag">Data source connections — what each feed is for, whether it's live, and when it last came through</span>
            </div>
            <div class="checked-at" id="checked-at"></div>
        </div>

        <div id="autorefresh-banner" class="autorefresh-banner"></div>

        <div id="sources-grid" class="sources-grid">
            <div class="table-loading">
                <div class="spinner"></div>
                <div>Checking all connections…</div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='sources.js') }}"></script>
</body>
</html>
