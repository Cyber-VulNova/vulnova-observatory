<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulNova ATT&CK — MITRE ATT&CK Matrix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <a href="/" class="brand-logo"><img src="{{ url_for('static', filename='vulnova-logo.svg') }}" alt="VulNova" class="brand-img"></a>
            <span class="brand-sub">Observatory</span>
            <nav class="topnav">
                <a href="/" class="topnav-link">Atlas · CVEs</a>
                <a href="/news" class="topnav-link">Pulse · News</a>
                <a href="/flare" class="topnav-link">Flare · Advisories</a>
                <a href="/sources" class="topnav-link">Signal · Sources</a>
                <a href="/orbit" class="topnav-link">Orbit · Tracking</a>
                <a href="/attack" class="topnav-link active">ATT&CK</a>
            </nav>
        </div>
        <div class="topbar-stats">
            <button id="theme-toggle" class="btn btn-ghost btn-sm theme-toggle" title="Toggle light / dark theme">☀️</button>
            <span class="stat-pill" id="attack-stat">— techniques</span>
        </div>
    </header>

    <main class="attack-page">
        <div class="atlas-intro" style="padding-left:0">
            <span class="atlas-title">ATT&CK</span>
            <span class="atlas-tag">The MITRE ATT&amp;CK® Enterprise matrix — adversary tactics and techniques.</span>
        </div>

        <div class="attack-toolbar">
            <input type="text" id="attack-search" placeholder="Search techniques (name or Txxxx id)…" autocomplete="off">
            <label class="attack-check"><input type="checkbox" id="attack-subs"> Include sub-techniques</label>
            <span class="attack-updated" id="attack-updated"></span>
        </div>

        <div id="attack-matrix" class="attack-matrix">
            <div class="table-loading">
                <div class="spinner"></div>
                <div>Loading the MITRE ATT&amp;CK matrix… (first load downloads the MITRE dataset and may take up to a minute)</div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='attack.js') }}"></script>
</body>
</html>
